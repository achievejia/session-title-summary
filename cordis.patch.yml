# ctx.sessionTitle.register() is single-slot ("the sole optional title
# provider"). The shipped experimental titles bundle registers
# optional-session-title-all-prompts and disables the built-in first-prompt
# row session-title-llm, so both must stay disabled for this provider to
# register. Idempotent overrides: harmless when a row is already disabled.
- id: optional-session-title-all-prompts
  disabled: true

- id: session-title-llm
  disabled: true

- insert:
    - id: session-title-summary
      name: 'dsh-session-title-summary'
      # If host core services are temporarily unavailable (for example during
      # an interrupted install), defer this optional plugin instead of making
      # the required host startup fatal. Loader re-evaluates this on remount.
      disabled: !!js "!ctx.get('sessionTitle') || !ctx.get('sessions')"
      config:
        cadence: all-prompts
        datePrefix: true
        timeZone: Asia/Shanghai
        builtinCategories: [功能, 设计, 整改, 优化, 发布, 分析, 文档]
        customCategories: [系统, 开发, 部署]
        synonyms:
          - [系统部署, 发布]
          - [部署工作, 发布]
          - [上线, 发布]
          - [代码开发, 功能]
          - [问题修复, 整改]
          - [bug修复, 整改]
          - [bug 修复, 整改]
          - [修bug, 整改]
          - [性能提升, 优化]
          - [性能优化, 优化]
          - [方案调研, 分析]
          - [页面设计, 设计]
          - [接口说明整理, 文档]
          - [开发类, 开发]
          - [开发工作, 开发]
        localFastPath: true
        fastPathKeywords:
          - [部署, 发布]
          - [上线, 发布]
          - [发布, 发布]
          - [修复, 整改]
          - [fix, 整改]
          - [bug, 整改]
          - [报错, 整改]
          - [崩溃, 整改]
          - [优化, 优化]
          - [重构, 优化]
          - [提速, 优化]
          - [设计, 设计]
          - [UI, 设计]
          - [界面, 设计]
          - [原型, 设计]
          - [文档, 文档]
          - [README, 文档]
          - [注释, 文档]
          - [调研, 分析]
          - [选型, 分析]
          - [评估, 分析]
          - [对比, 分析]
        fastPathMaxChars: 60
        minConfidence: 0.6
        topicMaxChars: 24
        windowFirst: 6
        windowLast: 12
        modelTag: none
        maxInputBytes: 8192
        maxOutputTokens: 200
        timeoutMs: 60000
        backfill: true
        backfillMaxSessions: 50
        backfillMinEvents: 3
        backfillDelayMs: 800
        backfillStartupDelayMs: 15000
        backfillIncludeUserTitles: false
        backfillIncludeSubagents: false
